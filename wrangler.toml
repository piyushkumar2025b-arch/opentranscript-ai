name = "opentranscript-ai"
main = "src/worker.ts"
compatibility_date = "2024-01-01"

# Cloudflare Pages configuration
[site]
bucket = "./dist"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "opentranscript-db"
database_id = "YOUR_D1_DATABASE_ID" # Replace after creating D1 database

# KV Namespace for caching and rate limiting
[[kv_namespaces]]
binding = "CACHE"
id = "YOUR_KV_NAMESPACE_ID" # Replace after creating KV namespace

# R2 bucket for media storage (optional, for uploaded audio/video)
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "opentranscript-media"

# Environment variables (set via wrangler secret or dashboard)
[vars]
ENVIRONMENT = "production"

# Development settings
[dev]
port = 8787
local_protocol = "http"

# Build settings
[build]
command = "npm run build:worker"

# Routes for API
# [[routes]]
# pattern = "api.yourdomain.com/*"
# zone_name = "yourdomain.com"
