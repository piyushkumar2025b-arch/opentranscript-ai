name = "opentranscript-ai"
compatibility_date = "2024-01-01"
pages_build_output_dir = "./dist"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "opentranscript-db"
database_id = "63763c38-3b0c-4504-8eda-26a94e041e62"

# KV Namespace for caching and rate limiting
[[kv_namespaces]]
binding = "CACHE"
id = "5c0077a9f7b64297b029e18b34ff9009"

# Environment variables (non-sensitive only — API keys go via `wrangler pages secret put`)
[vars]
ENVIRONMENT = "production"

# Local dev settings
[dev]
port = 8787
local_protocol = "http"
